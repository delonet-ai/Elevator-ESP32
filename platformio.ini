; Elevator ESP32 — две прошивки в одном проекте.
;
;   pio run -e lift            собрать базу
;   pio run -e lift -t upload  прошить базу
;   pio run -e remote          собрать пульт
;   pio device monitor         открыть лог
;
; Общий для обеих прошивок протокол лежит в src/common и подключается
; через build_flags; в сборку каждой прошивки попадает только её каталог.

[platformio]
default_envs = lift, remote

[env]
platform  = espressif32@^6.9.0
framework = arduino
board     = esp32dev

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -I src/common
    -Wall
    -Wextra
    -DLOG_LEVEL=3

; Проверки статического анализатора: pio check
check_tool  = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr
check_skip_packages = yes

[env:lift]
build_src_filter = +<lift/>
lib_deps =
    gin66/FastAccelStepper@^0.31.6
    tzapu/WiFiManager@2.0.17

[env:remote]
build_src_filter = +<remote/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1

; Стендовое окружение: та же логика базы плюс команды для проверки
; без собранной шахты (подстановка калибровки, имитация концевика).
; Для прошивки лифта использовать НЕ нужно.
[env:lift_bench]
extends = env:lift
build_flags = ${env.build_flags} -DBENCH_COMMANDS
