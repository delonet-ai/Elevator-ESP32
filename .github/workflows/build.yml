name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test embedded web interface
        run: node --test tests/*.test.cjs
      - name: Test calibration ownership and timeouts
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/web_control_policy_test.cpp -o /tmp/web-policy-test
          /tmp/web-policy-test
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/stubs -I src/common tests/web_calibration_runtime_test.cpp -o /tmp/web-runtime-test
          /tmp/web-runtime-test
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/stubs -I src/common tests/calibration_storage_test.cpp -o /tmp/calibration-storage-test
          /tmp/calibration-storage-test
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/stubs tests/motion_settings_test.cpp -o /tmp/motion-settings-test
          /tmp/motion-settings-test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [lift, remote, lift_bench]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
